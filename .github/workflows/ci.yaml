name: Continuous Integration

on:
  push: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10.8"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - run: |
          pytest tests/util
